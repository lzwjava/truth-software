<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="女性程序员头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- hair back -->
  <ellipse cx="100" cy="80" rx="43" ry="45" fill="#33273f"/>
  <!-- neck -->
  <rect x="91" y="97" width="18" height="18" rx="5" fill="#e8b48c"/>
  <!-- face -->
  <ellipse cx="100" cy="83" rx="30" ry="32" fill="#f8c49a"/>
  <!-- hair front / bangs -->
  <path d="M69 78 Q69 48 100 48 Q131 48 131 78 Q130 64 121 60 Q124 62 114 58 Q110 50 100 50 Q90 50 86 58 Q76 62 79 60 Q70 64 69 78 Z" fill="#33273f"/>
  <!-- eyes -->
  <circle cx="89" cy="84" r="3.2" fill="#33273f"/>
  <circle cx="111" cy="84" r="3.2" fill="#33273f"/>
  <!-- smile -->
  <path d="M93 94 Q100 100 107 94" stroke="#c86f5a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="81" cy="92" r="4" fill="#f59e9e" opacity="0.55"/>
  <circle cx="119" cy="92" r="4" fill="#f59e9e" opacity="0.55"/>
  <!-- torso / top -->
  <path d="M64 200 Q64 150 78 138 Q88 132 100 132 Q112 132 122 138 Q136 150 136 200 Z" fill="#ec4899"/>
  <!-- shirt collar -->
  <path d="M88 137 Q100 152 112 137 L111 143 Q100 158 89 143 Z" fill="#ffffff" opacity="0.85"/>
  <!-- laptop base -->
  <rect x="56" y="176" width="88" height="11" rx="4" fill="#2b2440"/>
  <!-- laptop lid -->
  <rect x="70" y="148" width="60" height="33" rx="5" fill="#2b2440"/>
  <rect x="75" y="153" width="50" height="23" rx="2" fill="#eef2ff"/>
  <!-- code lines -->
  <rect x="79" y="159" width="24" height="3" rx="1.5" fill="#ec4899"/>
  <rect x="79" y="166" width="36" height="3" rx="1.5" fill="#f59e0b"/>
  <rect x="79" y="173" width="18" height="3" rx="1.5" fill="#8b5cf6"/>
</svg>
